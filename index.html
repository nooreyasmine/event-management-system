<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EventHub — Event Management System</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-icon">🗓️</span>
        <span class="brand-name">EventHub</span>
      </div>
      <nav class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
        <button id="exportBtn" class="icon-btn" title="Export events" aria-label="Export events">⬇️</button>
        <label class="icon-btn" title="Import events" aria-label="Import events">
          ⬆️
          <input type="file" id="importInput" accept=".json" hidden />
        </label>
        <button id="openFormBtn" class="btn btn-primary">+ New Event</button>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- ===== STATS DASHBOARD ===== -->
    <section class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total Events</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statUpcoming">0</span>
        <span class="stat-label">Upcoming</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statPast">0</span>
        <span class="stat-label">Past</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statAttendees">0</span>
        <span class="stat-label">Total Attendees</span>
      </div>
    </section>

    <!-- ===== CONTROLS: SEARCH / FILTER / SORT ===== -->
    <section class="controls">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search events by title or location…" />
      </div>
      <div class="filter-wrap">
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="Conference">Conference</option>
          <option value="Workshop">Workshop</option>
          <option value="Meetup">Meetup</option>
          <option value="Webinar">Webinar</option>
          <option value="Party">Party</option>
          <option value="Other">Other</option>
        </select>
        <select id="statusFilter">
          <option value="all">All Events</option>
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
        </select>
        <select id="sortOrder">
          <option value="date-asc">Date ↑ (Soonest first)</option>
          <option value="date-desc">Date ↓ (Latest first)</option>
          <option value="title-asc">Title (A–Z)</option>
        </select>
        <div class="view-toggle">
          <button id="gridViewBtn" class="view-btn active" title="Grid view">▦</button>
          <button id="listViewBtn" class="view-btn" title="List view">☰</button>
        </div>
      </div>
    </section>

    <!-- ===== EVENTS LIST ===== -->
    <section id="eventsContainer" class="events-grid"></section>

    <!-- ===== EMPTY STATE ===== -->
    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">📭</div>
      <h3>No events found</h3>
      <p>Try adjusting your filters, or create a new event to get started.</p>
      <button class="btn btn-primary" id="emptyCreateBtn">+ Create your first event</button>
    </div>

  </main>

  <!-- ===== EVENT FORM MODAL ===== -->
  <div id="formModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="formTitle">Create New Event</h2>
        <button class="close-btn" id="closeFormBtn" aria-label="Close">✕</button>
      </div>
      <form id="eventForm" class="modal-body" novalidate>
        <input type="hidden" id="eventId" />

        <label class="field">
          <span>Event Title <em>*</em></span>
          <input type="text" id="title" required maxlength="80" placeholder="e.g. React Fundamentals Workshop" />
          <small class="error-text" id="err-title"></small>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Category</span>
            <select id="category">
              <option>Conference</option>
              <option>Workshop</option>
              <option>Meetup</option>
              <option>Webinar</option>
              <option>Party</option>
              <option>Other</option>
            </select>
          </label>
          <label class="field">
            <span>Max Attendees</span>
            <input type="number" id="maxAttendees" min="1" placeholder="e.g. 50" />
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>Date <em>*</em></span>
            <input type="date" id="date" required />
            <small class="error-text" id="err-date"></small>
          </label>
          <label class="field">
            <span>Time <em>*</em></span>
            <input type="time" id="time" required />
            <small class="error-text" id="err-time"></small>
          </label>
        </div>

        <label class="field">
          <span>Location <em>*</em></span>
          <input type="text" id="location" required maxlength="100" placeholder="e.g. Community Hall, Vijayawada or Zoom" />
          <small class="error-text" id="err-location"></small>
        </label>

        <label class="field">
          <span>Description</span>
          <textarea id="description" rows="4" maxlength="600" placeholder="What's this event about?"></textarea>
        </label>

        <label class="field">
          <span>Cover Image URL</span>
          <input type="url" id="image" placeholder="https://…" />
        </label>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== EVENT DETAILS MODAL ===== -->
  <div id="detailsModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="detailsTitle">Event Details</h2>
        <button class="close-btn" id="closeDetailsBtn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
    </div>
  </div>

  <!-- ===== CONFIRM DELETE MODAL ===== -->
  <div id="confirmModal" class="modal-overlay" hidden>
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Event?</h2>
        <button class="close-btn" id="closeConfirmBtn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p>This action can't be undone. Are you sure you want to delete this event?</p>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="cancelDeleteBtn">Cancel</button>
          <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/script.js"></script>
</body>
</html>
